[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-neural-facial-deformer"
version = "0.1.0"
description = "Research scaffolding for adaptive neural facial deformation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
