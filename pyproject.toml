[project]
name = "adaptive-neural-facial-deformer"
version = "0.1.0"
description = "Adaptive Neural Facial Deformer: neural blendshape solving and corrective deformation for facial rigs"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "torch>=2.7",
    "usd-core>=24.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "matplotlib>=3.8"]
media = ["pillow>=10", "imageio-ffmpeg>=0.5"]

[project.scripts]
anfd-solve = "anfd.solve:main"
anf-deformer = "anf_deformer.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anfd", "src/anf_deformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
